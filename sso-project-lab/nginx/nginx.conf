events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 1. Routing สำหรับ Central Auth Service (หน้า Login)
    server {
        listen 80;
        server_name localhost;

        # จัดการกรณีผู้ใช้เข้า /auth หรือ /lab โดยไม่มี trailing slash
        location = /auth {
            return 301 /auth/;
        }

        location = /lab {
            return 301 /lab/;
        }

        # ถ้าผู้ใช้เข้า URL ที่ขึ้นต้นด้วย /auth ให้ส่งไปที่ central-auth
        location /auth/ {
            proxy_pass http://central-auth:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ส่งผ่านข้อมูล Cookie เพื่อให้เบราว์เซอร์รับ Set-Cookie ได้สมบูรณ์
            proxy_pass_header Set-Cookie;
        }

        # 2. Routing สำหรับระบบจองห้องแล็บ (Web App 1)
        # ถ้าเข้า URL ปกติ หรือ /lab ให้ส่งไปที่ web-app-1
        location /lab/ {
            proxy_pass http://web-app-1:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ส่งผ่านข้อมูล Cookie เพื่อให้แอปปลายทางนำ JWT ไปตรวจสอบ
            proxy_pass_header Set-Cookie;
        }

        # หน้าหลัก (Root) ให้ Redirect ไปที่หน้าเว็บแล็บชั่วคราว
        location = / {
            return 301 /lab/;
        }
    }
}

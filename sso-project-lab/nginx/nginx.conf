events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # จัดการกรณีผู้ใช้เข้า URL โดยไม่มี trailing slash
        location = /auth {
            return 301 /auth/;
        }

        location = /lab {
            return 301 /lab/;
        }

        location = /equipment {
            return 301 /equipment/;
        }

        # Backward compatibility สำหรับกรณีเข้า /lab/equipment
        location ~ ^/lab/equipment/?$ {
            return 301 /equipment/;
        }

        # สไลด์นำเสนอ Canva
        location ~ ^/(presentation|slides)/?$ {
            return 302 https://www.canva.com/design/DAHUnGy3I7A/YDtBe5kUc4WF2K4XeFZheQ/edit;
        }

        # 1. Routing สำหรับ Central Auth Service (พอร์ต 3000)
        location /auth/ {
            proxy_pass http://central-auth:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ส่งผ่านข้อมูล Cookie เพื่อให้เบราว์เซอร์รับ Set-Cookie ได้สมบูรณ์
            proxy_pass_header Set-Cookie;
        }

        # 2. Routing สำหรับระบบจองห้องแล็บ (Web App 1 - พอร์ต 4001)
        location /lab/ {
            proxy_pass http://web-app-1:4001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header Set-Cookie;
        }

        # 3. Routing สำหรับระบบยืมอุปกรณ์ (Web App 2 - พอร์ต 4002)
        location /equipment/ {
            proxy_pass http://web-app-2:4002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header Set-Cookie;
        }

        # หน้าหลัก (Root) ให้ Redirect ไปที่หน้าเว็บแล็บ (Web App 1)
        location = / {
            return 301 /lab/;
        }
    }
}

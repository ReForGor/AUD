version: '3.8'

services:
  # ----------------------------------------------------
  # 1. RADIUS Server (FreeRADIUS)
  # ----------------------------------------------------
  freeradius:
    build: ./freeradius
    container_name: sso_radius
    ports:
      - "1812:1812/udp"
    networks:
      - kmitl_sso_net
    restart: unless-stopped

  # ----------------------------------------------------
  # 2. PostgreSQL Database (Relational Data & Audit Logs)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sso_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sso_db
      - POSTGRES_USER=sso_user
      - POSTGRES_PASSWORD=sso_password
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kmitl_sso_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_user -d sso_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------
  # 3. Central Auth Service (SSO API & Login Portal)
  # ----------------------------------------------------
  central-auth:
    build: ./central-auth
    container_name: sso_central_auth
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RADIUS_HOST=freeradius # อ้างอิงชื่อ Container ได้เลย (DNS อัตโนมัติ)
      - RADIUS_SECRET=testing123
      - JWT_SECRET=kmitl_chumphon_sso_secret_key
      - DATABASE_URL=postgresql://sso_user:sso_password@postgres:5432/sso_db
    networks:
      - kmitl_sso_net
    depends_on:
      - freeradius
      - postgres
    restart: unless-stopped

  # ----------------------------------------------------
  # 4. Web Application 1 (Page 1: ระบบจองห้องแล็บคอมพิวเตอร์)
  # ----------------------------------------------------
  web-app-1:
    build: ./web-app-1
    container_name: sso_web_app_1
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - JWT_SECRET=kmitl_chumphon_sso_secret_key
      - AUTH_URL=http://localhost/auth
      - DATABASE_URL=postgresql://sso_user:sso_password@postgres:5432/sso_db
    networks:
      - kmitl_sso_net
    depends_on:
      - postgres
    restart: unless-stopped

  # ----------------------------------------------------
  # 5. Web Application 2 (Page 2: ระบบยืม-คืนอุปกรณ์ห้องแล็บ)
  # ----------------------------------------------------
  web-app-2:
    build: ./web-app-2
    container_name: sso_web_app_2
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - JWT_SECRET=kmitl_chumphon_sso_secret_key
      - AUTH_URL=http://localhost/auth
      - DATABASE_URL=postgresql://sso_user:sso_password@postgres:5432/sso_db
    networks:
      - kmitl_sso_net
    depends_on:
      - postgres
    restart: unless-stopped

  # ----------------------------------------------------
  # 6. Nginx (Reverse Proxy & Load Balancer)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: sso_nginx_proxy
    ports:
      - "80:80" # เข้าใช้งานผ่านพอร์ต 80 ของ localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./presentation.html:/usr/share/nginx/html/presentation.html:ro
    depends_on:
      - central-auth
      - web-app-1
      - web-app-2
    networks:
      - kmitl_sso_net
    restart: unless-stopped

# กำหนด Network ภายในเพื่อให้ Container คุยกันเองได้
networks:
  kmitl_sso_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24

volumes:
  postgres_data:
    driver: local
